name: Keepalive

# Daily ping so the free-tier Supabase project is not paused for inactivity, and
# a commit to the dedicated `keepalive` branch so GitHub never auto-disables this
# schedule after 60 days without repo activity. Never touches main, so the Pages
# deploy (main only) is not triggered.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Supabase keepalive RPC
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Commit timestamp to keepalive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin keepalive >/dev/null; then
            git fetch --depth=1 origin keepalive
            git checkout -B keepalive FETCH_HEAD
          else
            git checkout --orphan keepalive
            git rm -rf --quiet .
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git add keepalive.txt
          git commit -m "keepalive $(cat keepalive.txt)"
          git push origin keepalive
