<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Company Raffle</title>
    <meta name="description" content="Enter this month’s Titans ticket raffle. Winners are drawn at random and posted here." />
    <meta name="theme-color" content="#004685" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews (Outlook, iMessage, Discord, Slack). Crawlers don't run JS, so these must stay static here, with absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Comfort Group" />
    <meta property="og:title" content="Company Raffle | The Comfort Group" />
    <meta property="og:description" content="Enter this month’s Titans ticket raffle. Winners are drawn at random and posted here." />
    <meta property="og:url" content="https://incoherentthoughts.github.io/raffle/" />
    <meta property="og:image" content="https://incoherentthoughts.github.io/raffle/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Comfort Group logo and the words Company Raffle on a blue background" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the admin's saved theme before first paint on every page (see useTheme.ts).
      try {
        var t = localStorage.getItem('raffle.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Nimbus Sans 300 via the company Adobe Fonts kit -->
    <link rel="stylesheet" href="https://use.typekit.net/sbh8dqi.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
